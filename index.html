<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掲示板チャット</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-shape"></div>
    <div class="background-shape shape-2"></div>

    <!-- オンラインカウンター -->
    <div id="onlineCounter" class="online-counter">
        <span class="status-dot"></span>
        <span id="userCount">1</span>人がオンライン
    </div>

    <!-- Login/User Button -->
    <div id="authContainer" class="auth-container">
        <button id="loginOpenBtn" class="auth-btn">ログイン</button>
        <div id="userInfo" class="user-info hidden">
            <span id="displayUserName" class="user-name"></span>
            <button id="logoutBtn" class="logout-btn">ログアウト</button>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <h2>本当に削除しますか？</h2>
            <p>この操作は取り消せません。</p>
            <div class="modal-actions">
                <button id="cancelDeleteBtn" class="secondary-btn">キャンセル</button>
                <button id="confirmDeleteBtn" class="danger-btn">削除する</button>
            </div>
        </div>
    </div>

    <!-- ログイン / 新規登録モーダル -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-content auth-modal">
            <button id="closeLoginBtn" class="close-btn">&times;</button>
            <h2 id="authModalTitle">ログイン</h2>
            <div class="auth-form">
                <div class="input-group">
                    <input type="text" id="authUsername" placeholder="ユーザー名" maxlength="20">
                </div>
                <div class="input-group">
                    <input type="password" id="authPassword" placeholder="パスワード">
                </div>
                <button id="authSubmitBtn" class="primary-btn">ログインする</button>
                <p class="auth-switch">アカウントをお持ちでないですか？ <a href="#" id="switchToRegister">新規登録</a></p>
            </div>
        </div>
    </div>

    <!-- 画像拡大プレビュー用モーダル -->
    <div id="imageModal" class="modal-overlay image-modal-overlay">
        <div class="image-modal-content">
            <button id="closeImageModalBtn" class="image-modal-close-btn">&times;</button>
            <img id="modalImage" src="" alt="拡大画像">
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container main-content-container">
        <section class="input-card">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="お名前" maxlength="20" autocomplete="off">
            </div>
            <div class="input-group">
                <textarea id="messageInput" placeholder="メッセージを入力してみよう..." rows="3"></textarea>
            </div>

            <!-- 画像プレビュー領域 -->
            <div id="imagePreviewContainer" class="image-preview-container hidden">
                <div class="image-preview-wrapper">
                    <img id="imagePreview" src="" alt="プレビュー">
                    <button type="button" id="removeImageBtn" class="remove-image-btn" title="画像を削除">&times;</button>
                </div>
            </div>

            <!-- 入力アクションバー（画像選択ボタン＆送信ボタン） -->
            <div class="input-actions-bar">
                <label for="imageInput" class="attach-image-btn" id="attachImageBtn" title="画像を添付">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>画像を追加</span>
                </label>

                <button id="sendBtn">
                    送信する
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>

            <button id="deleteAllBtn" class="delete-all-btn"
                style="width: 100%; margin-top: 1rem; background: #fee2e2; color: #ef4444; justify-content: center;">
                自分の投稿を全て削除
            </button>
            <button id="adminDeleteBtn" class="admin-delete-btn"
                style="width: 100%; margin-top: 0.5rem; background: #991b1b; color: white; justify-content: center; font-size: 0.8rem; padding: 0.5rem;">
                管理者用: 全投稿を削除
            </button>
        </section>

        <section id="messagesContainer" class="messages-container">
            <div class="loading-state">読み込み中...</div>
        </section>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
